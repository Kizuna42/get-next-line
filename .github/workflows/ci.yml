name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  norminette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install norminette
      - run: norminette get_next_line.c get_next_line_utils.c get_next_line.h get_next_line_bonus.c get_next_line_utils_bonus.c get_next_line_bonus.h

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: ./tests/run_tests.sh
